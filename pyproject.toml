[project]
name = "ia-university-classic-rag"
version = "0.1.0"
description = "University Text-to-SQL Generator Service (Classic RAG)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg",
    "datacompy",
    "datasets",
    "fastapi",
    "httpx",
    "langchain",
    "langchain-openai",
    "langchain-pinecone>=0.2.0",
    "langchain-text-splitters",
    "pandas",
    "pinecone",
    "pytest",
    "pytest-asyncio",
    "ragas",
    "sqlglot",
    "tiktoken",
    "uvicorn",
]