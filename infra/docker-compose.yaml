name: university

services:
  postgres-db:
    build:
      context: ..
      dockerfile: infra/pg.Dockerfile
    container_name: ${POSTGRES_HOST}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  python-app:
    build:
      context: ..
      dockerfile: infra/app.Dockerfile
    container_name: python_env
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ..:/app
    ports:
      - "8001:8000"
    command: uvicorn src.api.routes:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres-db

volumes:
  postgres_data: